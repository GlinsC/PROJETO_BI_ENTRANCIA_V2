<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Erro{% endblock %} - Arcanjo Promotorias</title>
    <style>
        body {
            align-items: center;
            background: #f3f6f8;
            color: #172b3a;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
        }
        main {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgb(18 59 93 / 10%);
            max-width: 520px;
            padding: 40px;
            text-align: center;
        }
        a { color: #1769aa; }
    </style>
</head>
<body>
    <main>
        <h1>{% block heading %}Ocorreu um erro{% endblock %}</h1>
        <p>{% block message %}Não foi possível concluir sua solicitação.{% endblock %}</p>
        <a href="/">Voltar ao início</a>
    </main>
</body>
</html>
